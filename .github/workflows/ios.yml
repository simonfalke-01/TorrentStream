name: Build iOS app

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    name: TorrentKit tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run engine tests
        working-directory: TorrentKit
        run: swift test

  ios-app:
    name: Build TorrentStream.ipa
    runs-on: macos-26
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks | grep -i ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('Podfile') }}
      - name: Install VLCKit (CocoaPods)
        run: pod install --repo-update
      - name: Build (device, unsigned)
        run: |
          xcodebuild -workspace TorrentStream.xcworkspace -scheme TorrentStream -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > xcodebuild.log 2>&1 \
            || { grep -E "error:|warning: .*unavailable" xcodebuild.log | sort -u | head -80; tail -30 xcodebuild.log; exit 1; }
          tail -3 xcodebuild.log
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TorrentStream.app Payload/
          zip -qry TorrentStream-unsigned.ipa Payload
          ls -lh TorrentStream-unsigned.ipa
      - name: Validate IPA
        run: |
          set -e
          unzip -tq TorrentStream-unsigned.ipa
          rm -rf ipa-check && mkdir ipa-check && unzip -q TorrentStream-unsigned.ipa -d ipa-check
          app=ipa-check/Payload/TorrentStream.app
          plutil -lint "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$app/Info.plist"
          lipo -info "$app/TorrentStream" "$app/Frameworks/VLCKit.framework/VLCKit"
          otool -L "$app/TorrentStream" | grep '@rpath' | while read -r lib _; do
            test -e "$app/Frameworks/${lib#@rpath/}" || { echo "missing embedded $lib"; exit 1; }
          done
          shasum -a 256 TorrentStream-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TorrentStream-unsigned-ipa
          path: TorrentStream-unsigned.ipa
      - name: Build (simulator)
        run: |
          xcodebuild -workspace TorrentStream.xcworkspace -scheme TorrentStream -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild-sim.log 2>&1 \
            || { grep -E "error:" xcodebuild-sim.log | sort -u | head -80; tail -30 xcodebuild-sim.log; exit 1; }
          tail -3 xcodebuild-sim.log
      - name: Package simulator app
        run: cd build-sim/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/TorrentStream-simulator.zip" TorrentStream.app
      - uses: actions/upload-artifact@v4
        with:
          name: TorrentStream-simulator-app
          path: TorrentStream-simulator.zip
      - name: Launch smoke test (simulator)
        env:
          GH_TOKEN: ${{ github.token }}
          # The 5.0 build, the last one known to launch on a phone.
          PREVIOUS_RUN: "44701004691"
        run: |
          APP=build-sim/Build/Products/Release-iphonesimulator/TorrentStream.app
          sign() { for f in "$1"/Frameworks/*.framework; do codesign --force -s - "$f"; done; codesign --force -s - "$1"; }
          sign "$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          check() {
            xcrun simctl launch "$UDID" "$BID"
            sleep 30
            if xcrun simctl spawn "$UDID" launchctl list | grep "UIKitApplication:$BID" | grep -qvE '^-'; then
              echo "$1: still running after 30 s"
            else
              echo "$1: APP IS NOT RUNNING"
              xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "TorrentStream"' 2>/dev/null | tail -60
              python3 .github/scripts/crash_report.py
              exit 1
            fi
            xcrun simctl terminate "$UDID" "$BID" || true
          }
          # A fresh install.
          xcrun simctl install "$UDID" "$APP"
          check "fresh install"
          # An update over the previous release, with the data it left behind.
          xcrun simctl uninstall "$UDID" "$BID"
          if gh run download "$PREVIOUS_RUN" -n TorrentStream-simulator-app -D previous; then
            (cd previous && unzip -q TorrentStream-simulator.zip)
            sign previous/TorrentStream.app
            xcrun simctl install "$UDID" previous/TorrentStream.app
            # Something watched, as on a phone in use: Home then loads those shows at launch.
            DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data)
            mkdir -p "$DATA/Library/Application Support/TorrentStream"
            python3 - "$DATA/Library/Application Support/TorrentStream/shows.json" <<'EOF'
          import json, sys, time
          now = time.time() - 978307200
          shows = [(191656, "Student Council"), (21, "One Piece"), (154587, "Frieren"), (16498, "Attack on Titan"), (182255, "Frieren 2")]
          show = lambda i, t: {"id": i, "title": t, "synonyms": [], "genres": []}
          json.dump({
              "myList": [show(i, t) for i, t in shows],
              "history": [{"show": show(i, t), "seasonID": i, "season": 1, "episode": 2, "watchedAt": now - n} for n, (i, t) in enumerate(shows)],
              "progress": {}, "sources": {}, "groups": {}, "roots": {},
          }, open(sys.argv[1], "w"))
          EOF
            check "previous release"
            xcrun simctl install "$UDID" "$APP"
            check "update"
          fi
